<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<base target="_top">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f0e0d;--sur:#181714;--sur2:#201e1b;--sur3:#2a2723;
  --bor:rgba(255,255,255,0.07);--bor2:rgba(255,255,255,0.13);
  --tx:#f0ebe3;--tx2:#a09890;--tx3:#6a6058;
  --ac:#e8875a;--ac2:#c96b3a;--re:#d4605a;--gr:#7ab86a;
  --am:#d4a84b;--tl:#4dbfa0;
  --r:8px;--rs:5px;
  --fb:'DM Sans',sans-serif;--fm:'DM Mono',monospace;
}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:13px;padding:0;}

/* LOGIN */
#login-screen{padding:32px 20px;text-align:center;}
.l-emoji{font-size:36px;margin-bottom:10px;}
.l-title{font-size:18px;font-weight:600;margin-bottom:4px;}
.l-sub{font-size:11px;color:var(--tx3);font-family:var(--fm);margin-bottom:20px;text-transform:uppercase;letter-spacing:.06em;}
.l-err{font-size:11px;color:var(--re);min-height:16px;margin-bottom:8px;font-family:var(--fm);}

/* MAIN APP */
#app{display:none;padding:12px 14px;}
.section-title{font-size:10px;color:var(--tx3);font-family:var(--fm);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;margin-top:16px;}
.section-title:first-child{margin-top:0;}

/* FORM */
label{display:block;font-size:10px;color:var(--tx3);font-family:var(--fm);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
label .req{color:var(--re);}
input,select,textarea{
  width:100%;background:var(--sur2);border:1px solid var(--bor2);
  border-radius:var(--rs);color:var(--tx);font-family:var(--fb);
  font-size:12px;padding:7px 10px;outline:none;transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--ac);}
input.invalid,select.invalid{border-color:var(--re);}
select option{background:var(--sur2);}
textarea{resize:vertical;line-height:1.5;}
.fg{margin-bottom:10px;}
.fr{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:10px;}
.field-err{font-size:10px;color:var(--re);font-family:var(--fm);margin-top:3px;display:none;}
.field-err.show{display:block;}
.req-note{font-size:10px;color:var(--tx3);font-family:var(--fm);margin-bottom:12px;}

/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;border-radius:var(--rs);font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:var(--fb);transition:all .15s;}
.btn-p{background:var(--ac);color:#fff;}
.btn-p:hover{background:var(--ac2);}
.btn-g{background:transparent;border:1px solid var(--bor2);color:var(--tx2);}
.btn-g:hover{background:var(--sur2);color:var(--tx);}
.btn-sm{padding:5px 10px;font-size:11px;width:auto;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* TABS */
.tabs{display:flex;gap:3px;margin-bottom:14px;background:var(--sur2);border-radius:var(--rs);padding:3px;}
.tab{flex:1;padding:6px;border-radius:4px;font-size:11px;cursor:pointer;color:var(--tx3);border:none;background:none;font-family:var(--fm);transition:all .15s;text-align:center;}
.tab.active{background:var(--sur3);color:var(--ac);}

/* OUTPUT */
.out-card{background:var(--sur2);border:1px solid var(--bor2);border-radius:var(--r);padding:12px;margin-top:12px;}
.out-meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.bdg{display:inline-block;font-size:9px;padding:2px 7px;border-radius:20px;font-family:var(--fm);}
.bn{background:var(--sur3);color:var(--tx2);border:1px solid var(--bor);}
.bw{background:rgba(212,168,75,.15);color:var(--am);border:1px solid rgba(212,168,75,.25);}
.bg{background:rgba(122,184,106,.15);color:var(--gr);border:1px solid rgba(122,184,106,.25);}
.out-subj{font-size:11px;color:var(--tx2);margin-bottom:8px;font-family:var(--fm);}
.out-subj strong{color:var(--tx);}
.out-body{font-size:12px;line-height:1.7;white-space:pre-wrap;color:var(--tx);max-height:200px;overflow-y:auto;border-top:1px solid var(--bor);padding-top:8px;}
.out-actions{display:flex;gap:6px;margin-top:10px;}

/* RECORDS */
.rec-item{background:var(--sur2);border:1px solid var(--bor);border-radius:var(--rs);padding:10px;margin-bottom:8px;}
.rec-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:5px;}
.rec-name{font-size:12px;font-weight:500;}
.rec-order{font-size:10px;color:var(--tx3);font-family:var(--fm);}
.rec-issue{font-size:10px;color:var(--tx2);margin-bottom:4px;font-family:var(--fm);}
.rec-subj{font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rec-actions{display:flex;gap:4px;}
.icon-btn{background:none;border:none;cursor:pointer;padding:3px;font-size:14px;color:var(--tx3);border-radius:3px;}
.icon-btn:hover{background:var(--sur3);}
.dup-badge{font-size:9px;background:rgba(212,168,75,0.2);color:var(--am);border:1px solid rgba(212,168,75,0.4);border-radius:3px;padding:1px 5px;font-family:var(--fm);margin-left:5px;}

/* EMPTY */
.empty{text-align:center;padding:32px 16px;color:var(--tx3);font-size:12px;font-family:var(--fm);}

/* TOAST */
#toast{position:fixed;bottom:12px;left:12px;right:12px;background:var(--sur3);border:1px solid var(--bor2);border-radius:var(--rs);padding:8px 14px;font-size:11px;color:var(--tx);font-family:var(--fm);z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;}
#toast.show{opacity:1;}

/* SPINNER */
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--sur3);border-radius:4px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="l-emoji" id="l-emoji">🐾</div>
  <div class="l-title" id="l-title">CS Email Tool</div>
  <div class="l-sub">Shipping Operations</div>
  <div class="fg" style="margin-bottom:8px;">
    <input type="password" id="pw" placeholder="Enter password" onkeydown="if(event.key==='Enter')tryLogin()" autofocus style="text-align:center;letter-spacing:.1em;"/>
  </div>
  <div class="l-err" id="l-err"></div>
  <button class="btn btn-p" onclick="tryLogin()">Sign in</button>
</div>

<!-- APP -->
<div id="app">
  <div class="tabs">
    <button class="tab active" id="tab-draft" onclick="switchTab('draft')">✉️ Draft</button>
    <button class="tab" id="tab-records" onclick="switchTab('records')">📋 Records</button>
  </div>

  <!-- DRAFT TAB -->
  <div id="pane-draft">
    <div class="req-note">Fields marked <span style="color:var(--re)">*</span> are required</div>
    <div class="fr">
      <div class="fg">
        <label>Customer name <span class="req">*</span></label>
        <input id="sn" placeholder="Maria Santos" oninput="clearInv('sn')"/>
        <div class="field-err" id="err-sn">Required</div>
      </div>
      <div class="fg">
        <label>Order number <span class="req">*</span></label>
        <input id="so" placeholder="#10482" oninput="clearInv('so')"/>
        <div class="field-err" id="err-so">Required</div>
      </div>
    </div>
    <div class="fg">
      <label>Store / domain <span class="req">*</span></label>
      <input id="ss" placeholder=".de  .kr  .nl  .fr …" oninput="clearInv('ss')"/>
      <div class="field-err" id="err-ss">Required</div>
    </div>
    <div class="fg">
      <label>Shipping issue <span class="req">*</span></label>
      <select id="si" onchange="toggleOther();clearInv('si')">
        <option value="">— Select issue —</option>
        <optgroup label="Delivery">
          <option>failed delivery attempt</option>
          <option>missing house number</option>
          <option>wrong postcode</option>
          <option>wrong or incomplete address</option>
          <option>recipient name issue with the courier</option>
          <option>remote or unserviced area, unable to deliver</option>
        </optgroup>
        <optgroup label="Parcel Status">
          <option>package awaiting customer pickup at parcel locker or post office</option>
          <option>package returned to sender</option>
          <option>parcel lost in transit</option>
          <option>parcel damaged in transit</option>
        </optgroup>
        <optgroup label="Regulatory">
          <option>customs or import issue</option>
          <option>Korea personal identification number required (12-digit ID)</option>
        </optgroup>
        <optgroup label="Other">
          <option value="__other__">Other (describe below)</option>
        </optgroup>
      </select>
      <div class="field-err" id="err-si">Required</div>
    </div>
    <div class="fg" id="other-wrap" style="display:none;">
      <label>Describe the issue <span class="req">*</span></label>
      <input id="si-other" placeholder="e.g. Parcel held at depot, tracking not updating…" oninput="clearInv('si-other')"/>
      <div class="field-err" id="err-si-other">Please describe the issue</div>
    </div>
    <div class="fg">
      <label>Additional notes (optional)</label>
      <textarea id="sk" rows="2" placeholder="e.g. Customer contacted twice, parcel held until Friday…"></textarea>
    </div>
    <button class="btn btn-p" id="draft-btn" onclick="doDraft()">
      ✉️ Draft email
    </button>
    <div id="draft-out"></div>
  </div>

  <!-- RECORDS TAB -->
  <div id="pane-records" style="display:none;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div class="section-title" style="margin:0;" id="rec-count">Loading…</div>
      <button class="btn btn-g btn-sm" onclick="loadRecords()">↻ Refresh</button>
    </div>
    <div id="rec-list"><div class="empty">Loading records…</div></div>
  </div>
</div>

<div id="toast"></div>

<script>
let CFG = { brand:'CS Tool', emoji:'🐾', signoff:'CS Team', tone:'warm and empathetic' };
let currentEmail = null;

// ── LOGIN ──────────────────────────────────────────────
function tryLogin(){
  const pw = document.getElementById('pw').value;
  google.script.run
    .withSuccessHandler(ok => {
      if(ok){
        document.getElementById('login-screen').style.display='none';
        document.getElementById('app').style.display='block';
        loadCFG();
        loadRecords();
      } else {
        document.getElementById('l-err').textContent='Incorrect password.';
        document.getElementById('pw').value='';
      }
    })
    .withFailureHandler(e => { document.getElementById('l-err').textContent=e.message; })
    .checkPassword(pw);
}

function loadCFG(){
  google.script.run
    .withSuccessHandler(cfg => {
      CFG = cfg;
      document.getElementById('l-emoji').textContent = cfg.emoji||'🐾';
      document.getElementById('l-title').textContent = (cfg.brand||'CS Tool')+' — Email Tool';
    })
    .getConfigForSidebar();
}

// ── TABS ───────────────────────────────────────────────
function switchTab(t){
  document.getElementById('pane-draft').style.display   = t==='draft'   ? 'block' : 'none';
  document.getElementById('pane-records').style.display = t==='records' ? 'block' : 'none';
  document.getElementById('tab-draft').classList.toggle('active', t==='draft');
  document.getElementById('tab-records').classList.toggle('active', t==='records');
  if(t==='records') loadRecords();
}

// ── VALIDATION ─────────────────────────────────────────
function markInv(id){ const el=document.getElementById(id); el&&el.classList.add('invalid'); const err=document.getElementById('err-'+id); err&&err.classList.add('show'); }
function clearInv(id){ const el=document.getElementById(id); el&&el.classList.remove('invalid'); const err=document.getElementById('err-'+id); err&&err.classList.remove('show'); }
function toggleOther(){ const v=document.getElementById('si').value; document.getElementById('other-wrap').style.display=v==='__other__'?'block':'none'; }
function getIssue(){ const v=document.getElementById('si').value; return v==='__other__' ? document.getElementById('si-other').value.trim() : v; }

// ── DRAFT ──────────────────────────────────────────────
function doDraft(){
  const name  = document.getElementById('sn').value.trim();
  const order = document.getElementById('so').value.trim();
  const store = document.getElementById('ss').value.trim();
  const issue = getIssue();

  let valid = true;
  if(!name) { markInv('sn'); valid=false; }
  if(!order){ markInv('so'); valid=false; }
  if(!store){ markInv('ss'); valid=false; }
  if(!issue){
    if(document.getElementById('si').value==='__other__') markInv('si-other');
    else { document.getElementById('si').classList.add('invalid'); document.getElementById('err-si').classList.add('show'); }
    valid=false;
  }
  if(!valid){ toast('Please fill in all required fields.'); return; }

  const btn = document.getElementById('draft-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Drafting…';
  document.getElementById('draft-out').innerHTML = '';

  google.script.run
    .withSuccessHandler(res => {
      btn.disabled = false;
      btn.innerHTML = '✉️ Draft email';
      if(!res.ok){ showError(res.error); return; }
      currentEmail = res;
      showResult(res, name, order, store);
      toast('Email drafted and saved to sheet ✓');
    })
    .withFailureHandler(e => {
      btn.disabled = false;
      btn.innerHTML = '✉️ Draft email';
      showError(e.message);
    })
    .draftEmail({
      name, order, store,
      issue,
      notes: document.getElementById('sk').value.trim(),
      signoff: CFG.signoff,
      tone: CFG.tone,
    });
}

function showResult(res, name, order, store){
  const sc = store.toLowerCase().replace(/[^a-z]/g,'') || 'com';
  document.getElementById('draft-out').innerHTML=`
    <div class="out-card">
      <div style="font-weight:500;font-size:13px;margin-bottom:6px;">${esc(name)} <span style="font-size:10px;color:var(--tx3);font-family:var(--fm);">· ${esc(order)}</span></div>
      <div class="out-meta">
        <span class="bdg bn">${flagFor(sc)} .${sc} · ${esc(res.lang)}</span>
        <span class="bdg bw">${esc(res.store||sc)}</span>
        <span class="bdg bg">Saved ✓</span>
      </div>
      <div class="out-subj">Subject: <strong id="out-subj-txt">${esc(res.subject)}</strong></div>
      <div class="out-body" id="out-body-txt">${esc(res.body)}</div>
      <div class="out-actions">
        <button class="btn btn-g btn-sm" onclick="copyEmail()" style="flex:1;">📋 Copy email</button>
        <button class="btn btn-g btn-sm" onclick="switchTab('records')" style="flex:1;">📋 View records</button>
      </div>
    </div>`;
}

function showError(msg){
  document.getElementById('draft-out').innerHTML=`
    <div class="out-card" style="border-color:rgba(212,96,90,.3);">
      <div style="color:var(--re);font-size:12px;font-family:var(--fm);">⚠️ ${esc(msg)}</div>
    </div>`;
}

function copyEmail(){
  if(!currentEmail) return;
  const text = 'Subject: '+currentEmail.subject+'\n\n'+currentEmail.body;
  copyText(text, 'Email copied ✓');
}

// ── RECORDS ────────────────────────────────────────────
function loadRecords(){
  document.getElementById('rec-count').textContent = 'Loading…';
  google.script.run
    .withSuccessHandler(renderRecords)
    .withFailureHandler(e => {
      document.getElementById('rec-list').innerHTML=`<div class="empty">Error: ${esc(e.message)}</div>`;
    })
    .getAllRecords();
}

function renderRecords(recs){
  document.getElementById('rec-count').textContent = recs.length + ' record' + (recs.length!==1?'s':'') + ' saved';
  const list = document.getElementById('rec-list');
  if(!recs.length){ list.innerHTML='<div class="empty">📭<br><br>No records yet.<br>Draft an email to get started.</div>'; return; }

  // Duplicate detection
  const dupMap={};
  recs.forEach(r=>{ if(r['Order #']){ const k=(r['Order #']+'|'+r['Store']).toLowerCase(); dupMap[k]=(dupMap[k]||0)+1; }});
  const isDup = r => r['Order #'] && dupMap[(r['Order #']+'|'+r['Store']).toLowerCase()]>1;

  list.innerHTML = recs.slice().reverse().map(r => `
    <div class="rec-item" style="${isDup(r)?'border-color:rgba(212,168,75,0.3);background:rgba(212,168,75,0.04);':''}">
      <div class="rec-top">
        <div>
          <div class="rec-name">${esc(r['Customer Name']||'—')}
            ${isDup(r)?'<span class="dup-badge" title="Same order + store drafted more than once">DUP</span>':''}
          </div>
          <div class="rec-order">${esc(r['Order #']||'—')} · ${flagFor((r['Store']||'').toLowerCase())} .${esc(r['Store']||'—')} · ${esc(r['Date']||'')}</div>
        </div>
        <div class="rec-actions">
          <button class="icon-btn" title="Copy email" onclick="copyRec(${r._row})">📋</button>
          <button class="icon-btn" title="Delete" style="color:var(--re);" onclick="delRec(${r._row})">🗑️</button>
        </div>
      </div>
      <div class="rec-issue">${esc((r['Issue']||'—').slice(0,60))}</div>
      <div class="rec-subj" title="${esc(r['Email Subject']||'')}">${esc((r['Email Subject']||'—').slice(0,55))}…</div>
    </div>`).join('');

  // Store records for copy
  window._recs = recs;
}

function copyRec(rowNum){
  const r = (window._recs||[]).find(x=>x._row===rowNum);
  if(!r) return;
  copyText('Subject: '+r['Email Subject']+'\n\n'+r['Email Body'], 'Copied ✓');
}

function delRec(rowNum){
  if(!window._confirmDelete){
    // First click — ask for confirmation
    window._confirmDelete = rowNum;
    toast('Click 🗑️ again to confirm deletion.');
    setTimeout(()=>{ window._confirmDelete=null; }, 3000);
    return;
  }
  if(window._confirmDelete !== rowNum){
    window._confirmDelete = rowNum;
    toast('Click 🗑️ again to confirm deletion.');
    setTimeout(()=>{ window._confirmDelete=null; }, 3000);
    return;
  }
  window._confirmDelete = null;
  google.script.run
    .withSuccessHandler(()=>{ toast('Record deleted.'); loadRecords(); })
    .withFailureHandler(e=>toast('Error: '+e.message))
    .deleteRecord(rowNum);
}

// ── HELPERS ────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }
function copyText(text, msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast(msg||'Copied ✓')).catch(()=>fallbackCopy(text,msg));
  } else { fallbackCopy(text, msg); }
}
function fallbackCopy(text, msg){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0;';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); toast(msg||'Copied ✓'); }
  catch(e){ toast('Copy failed — select text manually.'); }
  document.body.removeChild(ta);
}
const FLAGS={com:'🌐',us:'🇺🇸',uk:'🇬🇧',au:'🇦🇺',ca:'🇨🇦',de:'🇩🇪',at:'🇦🇹',ch:'🇨🇭',fr:'🇫🇷',be:'🇧🇪',es:'🇪🇸',mx:'🇲🇽',nl:'🇳🇱',kr:'🇰🇷',jp:'🇯🇵',it:'🇮🇹',pt:'🇵🇹',br:'🇧🇷',pl:'🇵🇱',se:'🇸🇪',no:'🇳🇴',dk:'🇩🇰',fi:'🇫🇮',ru:'🇷🇺',tr:'🇹🇷',cn:'🇨🇳',tw:'🇹🇼',hk:'🇭🇰',ar:'🇦🇷',};
function flagFor(sc){ return FLAGS[sc]||'🌐'; }
</script>
</body>
</html>
